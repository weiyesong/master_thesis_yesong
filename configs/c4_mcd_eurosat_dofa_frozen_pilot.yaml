data:
  name: eurosat
  input_bands: rgb
  channels: [B04, B03, B02]
  wavelengths_nm: [664.6300422881802, 559.5987534818435, 492.9971095687347]
  wavelength_source: https://github.com/geobreeze/geobreeze/blob/main/geobreeze/datasets/metadata/sensors/sentinel2.yaml
  source: torchgeo_all_bands
  artifact_path: ./data/EuroSATallBands.zip
  artifact_sha256: 751f070f9bffa2eed48b24ca2dd0b02959280c08837e8c9a5532a67ba611df59
  root: ./data
  split_manifest: ./splits/eurosat_70_10_10_10_spatial20m/eurosat_splits.csv
  split_manifest_sha256: c5cadc7936394f0678307f7db25c55a2dc19f73ddb93891b772c16221e8abf22
  augmentations: {train: none, val: none, calibration: none, test: none}
  download: false
  image_size: 224
  normalize: true
  normalization:
    method: channelwise_standardization
    statistics_split: train
    statistics_manifest: ./splits/eurosat_70_10_10_10_spatial20m/eurosat_splits.csv
    raw_units: Sentinel-2_L2A_DN
    mean: [936.085209866211, 1031.3388562784282, 1111.4795678522003]
