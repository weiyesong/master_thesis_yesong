    sample_count: 18866
    pixel_count_per_channel: 77275136
  num_classes: 10
  class_names: [AnnualCrop, Forest, HerbaceousVegetation, Highway, Industrial, Pasture, PermanentCrop, Residential, River, SeaLake]
  num_workers: 0

training:
  epochs: 1
  batch_size: 64
  optimizer: {name: adamw}
  learning_rate: 0.001
  backbone_learning_rate: 0.001
  head_learning_rate: 0.001
  weight_decay: 0.01
  early_stopping: {enabled: true, patience: 10, min_delta: 0.0}
  checkpoint: {split: val, metric: nll, mode: min}
  limit_train_batches: 1
  limit_val_batches: 1

metrics: {n_bins: 15}
reproducibility: {deterministic: true, warn_only: false}
prediction_export: {enabled: false}
visualization: {enabled: false, track_gradient_norm: true}
uq_methods: [{name: none}]

dry_run_settings:
  epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  num_workers: 0
  output_dir: ./results/c4_mc_dropout_pilots/classification/eurosat_dofa_frozen

experiments:
  - name: c4_mcd_eurosat_dofa_frozen_pilot
    task: classification
    model:
      name: dofa
      size: base
      pretrained: true
      drop_rate: 0.0
      adaptation_mode: frozen
      head:
        architecture: batchnorm_linear
        batchnorm_affine: false
        batchnorm_eps: 1.0e-6
        dropout: 0.10
      global_pool: false
      dofa_root: ./DOFA
      weights_path: ./DOFA/checkpoints/DOFA_ViT_base_e100.pth
