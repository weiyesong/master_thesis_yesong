  augmentations: {train: none, val: none, calibration: none, test: none}
  num_workers: 4

training:
  epochs: 100
  batch_size: 64
  optimizer: {name: adamw}
  learning_rate: 0.0001
  backbone_learning_rate: 0.0001
  head_learning_rate: 0.001
  weight_decay: 0.01
  warmup: {enabled: true, epochs: 5, type: linear}
  gradient_clipping: {enabled: false}
  layerwise_lr_decay: {enabled: false}
  early_stopping: {enabled: true, patience: 15, min_delta: 0.0}
  checkpoint: {split: val, metric: nll, mode: min}
  limit_train_batches: null
  limit_val_batches: null

metrics:
  n_bins: 15
  multilabel_threshold: 0.5

uq_methods: [{name: none}]
reproducibility: {deterministic: true, warn_only: false}

prediction_export:
  enabled: true
  splits: [test]
  save_backbone_representation: true
  save_embeddings: true
  format: parquet
  stochastic_format: compressed_npz
  corruption_type: none
  corruption_severity: 0

dry_run_settings:
  epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  num_workers: 0
  output_dir: ./results/final_thesis/classification/treesatai_full_finetune/dry_runs

visualization:
  enabled: true
  update_every_epochs: 1
  track_gradient_norm: true

experiments:
