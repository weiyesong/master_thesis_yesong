seed: 42
device: auto
output_dir: ./results/experiments

task: classification

data:
  name: eurosat
  channels: [B01, B02, B03, B04, B05, B06, B07, B08, B8A, B09, B10, B11, B12]
  wavelengths_nm: [443, 490, 560, 665, 705, 740, 783, 842, 865, 945, 1375, 1610, 2190]
  root: ./data/eurosat
  download: true
  image_size: 224
  normalize: true
  num_classes: 10
  num_workers: 4

training:
  batch_size: 32
  epochs: 5
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

metrics:
  n_bins: 15

uq_methods:
  - name: none
  - name: temperature_scaling
    max_iter: 50
  - name: mc_dropout
    samples: 10

experiments:
  - name: dofa_small_eurosat
    task: classification
    model:
      name: dofa
      actual_wavelengths: [0.443, 0.490, 0.560, 0.665, 0.705, 0.740, 0.783, 0.842, 0.865, 0.945, 1.375, 1.610, 2.190]
      actual_wavelength_units: micrometers
      size: small
      pretrained: true
      freeze_backbone: false
      drop_rate: 0.1

  - name: dofa_base_eurosat
    task: classification
    model:
      name: dofa
      actual_wavelengths: [0.443, 0.490, 0.560, 0.665, 0.705, 0.740, 0.783, 0.842, 0.865, 0.945, 1.375, 1.610, 2.190]
      actual_wavelength_units: micrometers
      size: base
      pretrained: true
      freeze_backbone: false
      drop_rate: 0.1

  - name: dofa_large_eurosat
    task: classification
    model:
      name: dofa
      actual_wavelengths: [0.443, 0.490, 0.560, 0.665, 0.705, 0.740, 0.783, 0.842, 0.865, 0.945, 1.375, 1.610, 2.190]
      actual_wavelength_units: micrometers
      size: large
      pretrained: true
      freeze_backbone: true
      drop_rate: 0.1

segmentation_experiments:
  - name: dofa_base_segmentation_template
    task: segmentation
    status: pending_dataset
    model:
      name: dofa
      actual_wavelengths: [0.443, 0.490, 0.560, 0.665, 0.705, 0.740, 0.783, 0.842, 0.865, 0.945, 1.375, 1.610, 2.190]
      actual_wavelength_units: micrometers
      size: base
      pretrained: true
