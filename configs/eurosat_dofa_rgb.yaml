seed: 42
device: auto
output_dir: ./results/first_stage_rgb
results_csv: ./results/first_stage_rgb/results.csv

task: classification

data:
  name: eurosat
  input_bands: rgb
  channels: [B04, B03, B02]
  wavelengths_nm: [665, 560, 490]
  # Use the thesis project's existing EuroSAT all-band archive and select
  # Sentinel-2 B04/B03/B02 in the transform for the RGB experiment.
  source: torchgeo_all_bands
  root: ./data
  split_manifest: ./splits/eurosat_70_10_10_10_spatial20m/eurosat_splits.csv
  augmentations:
    train: none
    val: none
    calibration: none
    test: none
  download: false
  image_size: 224
  val_fraction: 0.2
  normalize: true
  num_classes: 10
  class_names:
    - AnnualCrop
    - Forest
    - HerbaceousVegetation
    - Highway
    - Industrial
    - Pasture
    - PermanentCrop
    - Residential
    - River
    - SeaLake
  num_workers: 4

training:
  epochs: 20
  batch_size: 32
  optimizer:
    name: adamw
  learning_rate: 1.0e-3
  backbone_learning_rate: 1.0e-4
  head_learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.0
  checkpoint:
    split: val
    metric: nll
    mode: min
  limit_train_batches: null
  limit_val_batches: null

metrics:
  n_bins: 15

reproducibility:
  deterministic: true

prediction_export:
  enabled: true
  splits: [val]
  save_backbone_representation: true
  save_embeddings: true
  format: parquet
  stochastic_format: compressed_npz
  corruption_type: none
  corruption_severity: 0

dry_run_settings:
  epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  num_workers: 0
  output_dir: ./results/first_stage_rgb/dry_runs

visualization:
  enabled: true
  update_every_epochs: 1
  track_gradient_norm: true

uq_methods:
  - name: none
  # Enable only after configuring a non-zero dropout in the model head.
  # - name: mc_dropout
  #   samples: 20
  # - name: temperature_scaling
  #   max_iter: 50

experiments:
  - name: eurosat_dofa_rgb
    task: classification
    model:
      name: dofa
      actual_wavelengths: [0.665, 0.560, 0.490]
      actual_wavelength_units: micrometers
      size: base
      pretrained: true
      drop_rate: 0.0
      adaptation_mode: frozen
      head:
        architecture: linear
        dropout: 0.0
      # DOFA_ViT_base_e100.pth contains the standard ViT final norm weights.
      # Keeping global_pool false lets the checkpoint load cleanly for linear probing.
      global_pool: false
      dofa_root: ./DOFA
      weights_path: ./DOFA/checkpoints/DOFA_ViT_base_e100.pth
